name = "napominalka"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Страницы из public/ встраиваются в код воркера перед сборкой.
[build]
command = "node scripts/build-assets.mjs"

# Хранилище данных (расписание, отметки, подписки).
# id хранилища в аккаунте Cloudflare (не секрет).
[[kv_namespaces]]
binding = "DB"
id = "84356a67928645c39140d187febb76bb"

# Проверять расписание каждую минуту.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
