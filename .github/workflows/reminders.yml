name: Рассылка напоминаний (вручную)

on:
  # Основная рассылка — каждую минуту в Cloudflare Worker (scheduler/).
  # Здесь — только ручной запуск: для проверки и как запасной вариант.
  workflow_dispatch:

permissions:
  contents: read
  actions: write # чтобы раз в сутки не дать GitHub выключить расписание

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            web/js
            sender
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Отправить напоминания
        run: node sender/send.mjs
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          DATA_REPO: ${{ vars.DATA_REPO }}
          GITHUB_TOKEN: ${{ github.token }}
