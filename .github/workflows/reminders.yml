name: Рассылка напоминаний

on:
  # Основная рассылка — каждую минуту в Cloudflare Worker (scheduler/).
  # Здесь — запасной вариант по расписанию и ручной запуск (в том числе «сообщение всем»).
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
    inputs:
      message:
        description: "Сообщение всем подключённым телефонам (пусто — не отправлять)"
        required: false
        default: ""
      title:
        description: "Заголовок сообщения"
        required: false
        default: "🔔 Напоминалка"

permissions:
  contents: read
  actions: write # чтобы раз в сутки не дать GitHub выключить расписание

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            web/js
            sender
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Отправить напоминания
        run: node sender/send.mjs
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          DATA_REPO: ${{ vars.DATA_REPO }}
          GITHUB_TOKEN: ${{ github.token }}
          BROADCAST_MESSAGE: ${{ inputs.message }}
          BROADCAST_TITLE: ${{ inputs.title }}
