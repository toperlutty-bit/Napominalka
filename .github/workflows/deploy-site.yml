name: Site — tests & deploy

on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  pull_request:
    paths:
      - "site/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    # Деплой на Cloudflare — только из main (или вручную), и только если заданы секреты.
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci

      - name: Проверить секреты
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Секрет CLOUDFLARE_API_TOKEN не задан — деплой пропущен. См. README, раздел «Сайт»."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Создать хранилище данных (KV), если его ещё нет
        if: steps.secrets.outputs.ok == 'true'
        run: |
          find_id() {
            npx wrangler kv namespace list 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const list = JSON.parse(s.slice(s.indexOf("[")));
                const ns = list.find(n => n.title === "napominalka-data" || n.title.endsWith("-napominalka-data"));
                if (ns) console.log(ns.id);
              });'
          }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create napominalka-data
            ID=$(find_id)
          fi
          if [ -z "$ID" ]; then echo "::error::Не удалось создать KV namespace"; exit 1; fi
          echo "KV namespace: $ID"
          sed -i "s/__KV_NAMESPACE_ID__/$ID/" wrangler.toml

      - name: Деплой
        if: steps.secrets.outputs.ok == 'true'
        run: npx wrangler deploy
